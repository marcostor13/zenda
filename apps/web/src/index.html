<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Doogking — Todo para tu rey, en un solo lugar</title>
  <base href="/">
  <!-- Configuración del entorno, escrita por el contenedor al arrancar. Va antes
       del bundle (script clásico, se ejecuta al momento) para que la app ya la
       encuentre. Si falta, la web usa los valores compilados por defecto. -->
  <script src="env.js"></script>
  <!--
    `viewport-fit=cover` lleva la web hasta los bordes físicos de la pantalla y
    es lo único que hace que `env(safe-area-inset-*)` devuelva algo distinto de
    cero en iOS. Sin él, las barras fijas de la app (el pie de reserva, la barra
    inferior, el aviso de sin conexión) quedaban debajo del notch y del
    indicador de inicio del iPhone, aunque el CSS ya las contemplaba.

    No se bloquea el zoom (`user-scalable=no`): quien necesita ampliar para leer
    debe poder hacerlo. El doble toque accidental se neutraliza en `styles.scss`
    con `touch-action: manipulation`, que quita el zoom por doble toque y deja
    intacto el de pellizco.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Doogking: reserva alojamiento canino, transporte de animales, veterinarios, peluquerías caninas y adiestramiento. Gestiona toda la vida de tu mascota desde un solo lugar.">
  <meta name="theme-color" content="#08258B">
  <!--
    El ?v= es un rompe-cachés a mano. Los ficheros de public/ se sirven con su
    nombre tal cual, así que su URL no cambia al cambiar el dibujo y el
    navegador sigue enseñando el que ya tenía. Al retocar la marca hay que
    subir este número.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="mask-icon" href="favicon.svg?v=2" color="#08258B">
  <link rel="apple-touch-icon" href="images/logo-doogking-d.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
