server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rutas de Angular Router: cualquier ruta que no sea un archivo real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La configuración se reescribe en cada arranque: si se cacheara, cambiar una
    # variable en Coolify no surtiría efecto hasta que caducase el navegador.
    location = /env.js {
        add_header Cache-Control "no-store";
        expires -1;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
