server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rutas de Angular Router: cualquier ruta que no sea un archivo real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La configuración se reescribe en cada arranque: si se cacheara, cambiar una
    # variable en Coolify no surtiría efecto hasta que caducase el navegador.
    location = /env.js {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # La caché se reparte según si el nombre del fichero lleva hash o no.
    #
    # Angular firma su salida con el hash del contenido (outputHashing: all):
    # los bundles de la raíz y lo que cuelga de /media/ cambian de URL en cuanto
    # cambia el contenido, así que se pueden guardar para siempre.
    #
    # Lo que hay en public/ —la marca, los iconos de categoría, el favicon— se
    # copia con su nombre tal cual y su URL no cambia nunca. Con los 30 días que
    # había antes, retocar el logotipo no lo veía nadie hasta un mes después:
    # fue justo lo que pasó al separar el punto de la "D" del isotipo.

    # Assets con hash: la URL cambia si cambia el contenido.
    location ~* ^/media/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:css|js|woff2?|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Assets sin hash (public/): se revalidan siempre. No es descargarlos cada
    # vez —si no han cambiado el servidor responde 304 y no viaja el cuerpo—,
    # pero un cambio de marca se ve al instante.
    location ~* \.(?:svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires -1;
        add_header Cache-Control "public, no-cache";
    }
}
