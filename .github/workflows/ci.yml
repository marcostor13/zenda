name: CI/CD — Reservalo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'libs/shared/**'
              - 'package.json'
              - 'package-lock.json'
            web:
              - 'apps/web/**'
              - 'libs/shared/**'
              - 'package.json'
              - 'package-lock.json'

  api:
    name: API — CI + Deploy
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests API (con cobertura)
        run: npm run test:api

      - name: Build API
        run: npm run build:api

      - name: Deploy API (Coolify webhook)
        if: github.ref == 'refs/heads/main'
        run: curl -fsSL -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}"

  web:
    name: Web — CI + Deploy
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests Web (con cobertura)
        run: npm run test:web

      - name: Build Web
        run: npm run build:web

      - name: Deploy Web (Coolify webhook)
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK_URL_WEB: ${{ secrets.COOLIFY_WEBHOOK_URL_WEB }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL_WEB" ]; then
            echo "::error::El secret COOLIFY_WEBHOOK_URL_WEB no está configurado en GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsSL -X POST "$COOLIFY_WEBHOOK_URL_WEB"
