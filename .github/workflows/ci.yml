name: CI/CD — Reservalo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'libs/shared/**'
              - 'package.json'
              - 'bun.lock'
            web:
              - 'apps/web/**'
              - 'libs/shared/**'
              - 'package.json'
              - 'bun.lock'

  api:
    name: API — CI + Deploy
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node sigue siendo el runtime de nest build; bun es el gestor de paquetes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Tests API (con cobertura)
        run: bun run test:api

      - name: Build API
        run: bun run build:api

      - name: Deploy API (Coolify webhook)
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: .github/scripts/desplegar-coolify.sh "$COOLIFY_WEBHOOK_URL" "$COOLIFY_API_TOKEN" "API"

  web:
    name: Web — CI + Deploy
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node sigue siendo el runtime de ng build; bun es el gestor de paquetes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Tests Web (con cobertura)
        run: bun run test:web

      - name: Build Web
        run: bun run build:web

      - name: Deploy Web (Coolify webhook)
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK_URL_WEB: ${{ secrets.COOLIFY_WEBHOOK_URL_WEB }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: .github/scripts/desplegar-coolify.sh "$COOLIFY_WEBHOOK_URL_WEB" "$COOLIFY_API_TOKEN" "web"
